name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# The source devDependencies reference the DeepSeek Harness checkout through
# relative `file:` links (../../DSHarness/deepseek-harness from source/).
# CI bootstraps that checkout at the pinned release tag so `npm ci` can link
# the exact harness packages the plugin compiles against.
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Bootstrap DeepSeek Harness checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceParent = (Resolve-Path "${{ github.workspace }}\..\..").Path
          $bootstrap = Join-Path $workspaceParent 'DSHarness\deepseek-harness'
          git clone --depth 1 --branch dsh-v0.1.0-rc.7 https://github.com/deepseek-ai/deepseek-harness.git $bootstrap
          Push-Location $bootstrap
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          Pop-Location
      - name: Use the runner temporary directory for tests
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ci
      - run: npm run test:coverage
      - run: npm run smoke
      - run: npm run package:verify
      - name: Verify repository distribution
        working-directory: .
        run: node --test test/distribution.test.mjs
      - name: Verify rebuilt runtime is committed in both trees
        working-directory: .
        run: git diff --exit-code -- source/dist/plugin.js plugins/project-design-keeper/dist/plugin.js

  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Bootstrap DeepSeek Harness checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspaceParent = (Resolve-Path "${{ github.workspace }}\..\..").Path
          $bootstrap = Join-Path $workspaceParent 'DSHarness\deepseek-harness'
          git clone --depth 1 --branch dsh-v0.1.0-rc.7 https://github.com/deepseek-ai/deepseek-harness.git $bootstrap
          Push-Location $bootstrap
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build
          Pop-Location
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: npm run smoke
